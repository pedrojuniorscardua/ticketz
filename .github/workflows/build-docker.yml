name: Create and publish multi-arch Docker images

on:
  push:
    # Linhares: o fork só publica imagens a partir da branch linhares
    branches:
      - 'linhares'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
        # Linhares: só amd64 (o servidor .111 é x86_64)
        platform: [amd64]
        include:
          - platform: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate git info
        run: |
          if [ "${{ matrix.image }}" = "backend" ]; then
            cat <<EOT > backend/src/gitinfo.ts
          export const GitInfo = {
              commitHash: "$(git rev-parse --short HEAD)",
              commitTimestamp: "$(date -u -d "$(git log -1 --format=%cI)" +'%Y-%m-%dT%H:%M:%SZ')",
              branchName: "$(git rev-parse --abbrev-ref HEAD)",
              tagName: "$(git describe --tags --abbrev=0 2>/dev/null)",
              buildTimestamp: "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          };
          EOT
          else
            cat <<EOT > frontend/public/gitinfo.json
          {
              "commitHash": "$(git rev-parse --short HEAD)",
              "commitTimestamp": "$(date -u -d "$(git log -1 --format=%cI)" +'%Y-%m-%dT%H:%M:%SZ')",
              "branchName": "$(git rev-parse --abbrev-ref HEAD)",
              "tagName": "$(git describe --tags --abbrev=0 2>/dev/null)",
              "buildTimestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOT
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ticketz-${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=ticketz-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: true
          platforms: linux/${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: TICKETZ_REGISTRY_URL=${{ secrets.TICKETZ_REGISTRY_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}
          provenance: true
          sbom: true

